<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zen Money — учёт финансов</title>
  <link rel="icon" href="data:,"><link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
<main>
  <header><p class="eyebrow">Личные финансы</p><h1>Zen Money</h1><p>Доходы, расходы и немного ясности.</p></header>
  <section class="summary" aria-label="Сводка по всем операциям">
    <article><span>Доходы</span><strong id="income" class="income">—</strong></article>
    <article><span>Расходы</span><strong id="expense" class="expense">—</strong></article>
    <article><span>Баланс</span><strong id="balance">—</strong></article>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
  <button id="reload" type="button" hidden>Повторить загрузку</button>
  <section class="panel">
    <h2 id="form-title">Новая операция</h2>
    <form id="transaction-form" novalidate>
      <fieldset id="transaction-fields" disabled>
        <div class="fields">
          <label>Сумма, BYN<input id="amount" name="amount" type="number" min="0.01" step="0.01" required aria-describedby="amount-error"><small id="amount-error" class="error"></small></label>
          <label>Тип<select id="type" name="type"><option value="expense">Расход</option><option value="income">Доход</option></select></label>
          <label>Категория<select id="categoryId" name="categoryId" required aria-describedby="categoryId-error"></select><small id="categoryId-error" class="error"></small></label>
          <label>Дата<input id="date" name="date" type="date" required aria-describedby="date-error"><small id="date-error" class="error"></small></label>
          <label class="wide">Комментарий<input id="comment" name="comment" maxlength="300"></label>
        </div>
        <div class="actions"><button type="submit" id="save">Добавить</button><button type="button" id="cancel" class="secondary" hidden>Отменить правку</button></div>
      </fieldset>
    </form>
  </section>
  <section class="panel">
    <h2>Новая категория</h2>
    <form id="category-form" novalidate>
      <fieldset id="category-fields" disabled><div class="fields">
        <label>Название<input id="category-name" maxlength="60" required aria-describedby="category-name-error"><small id="category-name-error" class="error"></small></label>
        <label>Тип<select id="category-type"><option value="expense">Расход</option><option value="income">Доход</option></select></label>
      </div><button type="submit">Создать категорию</button></fieldset>
    </form>
  </section>
  <section class="panel">
    <h2>История операций</h2>
    <form id="filters" class="fields">
      <label>Тип<select name="type"><option value="">Все</option><option value="income">Доходы</option><option value="expense">Расходы</option></select></label>
      <label>Категория<select name="category"><option value="">Все категории</option></select></label>
      <label>Дата с<input type="date" name="from"></label><label>Дата по<input type="date" name="to"></label>
      <button type="reset" class="secondary">Сбросить фильтры</button>
    </form>
    <p id="filter-error" class="error" role="alert"></p>
    <p id="count"></p><div id="transactions" class="transactions" aria-busy="true"></div>
  </section>
</main>
</body></html>
